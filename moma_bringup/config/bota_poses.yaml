# bota_poses.yaml

poses:
  # TOOL TIP: pointing down (Z axis)
  z_down:
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}  # identity quaternion

  # TOOL TIP: pointing X forward (X down in base frame)
  x_down:
    position: {x: 0.2, y: 0.0, z: -0.3}
    orientation: {x: 0.0, y: 0.7071, z: 0.0, w: 0.7071}  # 90 deg around Y

  # TOOL TIP: pointing Y left
  y_down:
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.7071, y: 0.0, z: 0.0, w: 0.7071}  # 90 deg around X

  xz_down:
    position: {x: 0.2, y: 0.0, z: -0.3}
    orientation: {x: 0.0, y: 0.382, z: 0.0, w: 0.924}

  yz_down:
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.382, y: 0.0, z: 0.0, w: 0.924}

  xy_down:
    position: {x: 0.2, y: 0.0, z: -0.3}
    orientation: {x: 0.5, y: 0.5, z: 0.5, w: 0.5}

  # Back to neutral (identity rotation) same as z_down
  neutral:
    position: {x: 0.0, y: 0.0, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}  # identity quaternion
